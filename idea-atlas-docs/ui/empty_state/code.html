<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Idea Atlas - Empty State</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#c5e7ff",
                    "on-secondary-container": "#b4b7d0",
                    "surface-container-low": "#191b22",
                    "on-background": "#e2e2eb",
                    "inverse-primary": "#855300",
                    "inverse-on-surface": "#2e3037",
                    "inverse-surface": "#e2e2eb",
                    "secondary-container": "#44485d",
                    "surface-container": "#1e1f26",
                    "on-secondary-fixed-variant": "#42465a",
                    "surface-container-high": "#282a30",
                    "on-error": "#690005",
                    "on-primary": "#472a00",
                    "primary-fixed-dim": "#ffb95f",
                    "surface": "#111319",
                    "secondary": "#c2c5de",
                    "on-error-container": "#ffdad6",
                    "on-surface-variant": "#d8c3ad",
                    "surface-variant": "#33343b",
                    "on-primary-fixed-variant": "#653e00",
                    "primary-container": "#f59e0b",
                    "on-primary-container": "#613b00",
                    "outline": "#a08e7a",
                    "surface-dim": "#111319",
                    "tertiary": "#8fd5ff",
                    "on-tertiary-fixed": "#001e2d",
                    "surface-container-highest": "#33343b",
                    "secondary-fixed-dim": "#c2c5de",
                    "error-container": "#93000a",
                    "on-primary-fixed": "#2a1700",
                    "surface-container-lowest": "#0c0e14",
                    "on-surface": "#e2e2eb",
                    "primary": "#ffc174",
                    "error": "#ffb4ab",
                    "outline-variant": "#534434",
                    "secondary-fixed": "#dee1fb",
                    "on-secondary-fixed": "#161b2d",
                    "on-tertiary": "#00344a",
                    "surface-tint": "#ffb95f",
                    "on-tertiary-container": "#004966",
                    "surface-bright": "#373940",
                    "on-secondary": "#2b2f43",
                    "background": "#111319",
                    "tertiary-fixed-dim": "#7fd0ff",
                    "primary-fixed": "#ffddb8",
                    "on-tertiary-fixed-variant": "#004c6a",
                    "tertiary-container": "#1abdff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "container-margin": "24px",
                    "2xl": "48px",
                    "sm": "8px",
                    "unit": "4px",
                    "xl": "32px",
                    "gutter": "16px",
                    "xs": "4px",
                    "lg": "24px",
                    "md": "16px"
            },
            "fontFamily": {
                    "label-sm": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-md": ["Inter"],
                    "display": ["Inter"],
                    "body-md": ["Inter"]
            },
            "fontSize": {
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "display": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0F1117; /* Specified empty state background */
        }
        
        .glass-panel {
            background: rgba(30, 31, 38, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .search-input:focus {
            outline: none;
            border-color: #F59E0B;
            box-shadow: 0 0 0 1px #F59E0B;
        }
    </style>
</head>
<body class="text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- TopNavBar -->
<header class="bg-surface-container dark:bg-surface-container docked full-width top-0 border-b border-outline-variant dark:border-outline-variant flat no shadows fixed top-0 left-0 w-full z-50 flex items-center justify-between px-lg h-16">
<div class="flex items-center gap-md">
<span class="font-display text-headline-md font-bold text-primary dark:text-primary tracking-tight">Idea Atlas</span>
</div>
<!-- No global nav in empty state based on strict rules -->
</header>
<!-- Main Content Canvas - Empty State -->
<main class="flex-grow flex items-center justify-center pt-16 relative">
<!-- Subtle animated background effect -->
<div class="absolute inset-0 overflow-hidden pointer-events-none opacity-20">
<div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container rounded-full mix-blend-screen filter blur-[100px] animate-pulse"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-surface-tint rounded-full mix-blend-screen filter blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>
</div>
<div class="w-full max-w-3xl px-md z-10 flex flex-col items-center">
<div class="w-full glass-panel rounded-xl p-md flex items-center gap-sm transition-all duration-300 focus-within:border-primary-container">
<span class="material-symbols-outlined text-outline-variant ml-sm" style="font-variation-settings: 'FILL' 0;">search</span>
<input autocomplete="off" class="search-input w-full bg-transparent border-none text-on-surface font-body-md placeholder:text-[#64748B] focus:ring-0 p-sm" placeholder="Type a topic to explore... (e.g. quantum computing)" type="text"/>
<button class="bg-primary-container hover:bg-primary-fixed text-[#0F1117] font-label-md px-lg py-sm rounded-lg transition-colors flex-shrink-0 flex items-center gap-xs">
                    Generate
                    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 0;">auto_awesome</span>
</button>
</div>
<p class="text-[#64748B] font-body-md mt-lg opacity-80 text-center animate-fade-in">
                Your maps will appear here
            </p>
</div>
</main>
<!-- Collapsed Sidebar Trigger -->
<div class="fixed bottom-lg left-lg z-50">
<button aria-label="Open Sidebar" class="w-12 h-12 bg-surface-container-high border border-outline-variant rounded-full flex items-center justify-center text-on-surface-variant hover:text-primary hover:border-primary transition-all group">
<span class="material-symbols-outlined group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 0;">menu_open</span>
</button>
</div>
</body></html>
