name: idea-atlas-prod

services:
  postgres:
    image: postgres:16
    container_name: idea-atlas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: atlas_db
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: idea-atlas-redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: idea-atlas-backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:root@postgres:5432/atlas_db
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGINS=http://147.93.168.208:5174
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: http://147.93.168.208:8002
    container_name: idea-atlas-frontend
    ports:
      - "5174:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data_prod:
