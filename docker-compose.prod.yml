name: idea-atlas-prod

services:
  redis:
    image: redis:7-alpine
    container_name: idea-atlas-redis
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: idea-atlas-backend
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - uploads_data:/app/uploads      # shared with the worker, survives rebuilds
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: idea-atlas-worker
    command: celery -A app.worker.celery_app worker --loglevel=INFO --concurrency=2 -Q atlas
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: https://api-atlas-ai.webtriggers.online
    container_name: idea-atlas-frontend
    ports:
      - "127.0.0.1:5174:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
